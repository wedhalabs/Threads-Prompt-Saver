<!doctype html>
<meta charset="utf-8" />
<title>Saved post</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 28px; max-width: 900px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { opacity: .7; margin: 0 0 22px; word-break: break-word; }
  fieldset { border: 1px solid rgba(128,128,128,.35); border-radius: 10px;
    padding: 16px 18px; margin: 0 0 18px; }
  legend { padding: 0 6px; font-weight: 600; }
  button { padding: 9px 16px; border-radius: 8px; border: 0; font-weight: 700;
    font-size: 14px; cursor: pointer; background: #6c8cff; color: #0c0f16; }
  button.ghost { background: transparent; color: inherit;
    border: 1px solid rgba(128,128,128,.55); font-weight: 600; }
  .hint { opacity: .75; font-size: 12.5px; margin-top: 10px; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .tile { border: 1px solid rgba(128,128,128,.35); border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column; }
  .tile img, .tile video { width: 100%; height: 170px; object-fit: cover; display: block;
    background: rgba(128,128,128,.15); }
  .tile .row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  .tile .name { font-size: 12px; opacity: .75; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 1; }
  .tile a { font-size: 12px; font-weight: 700; text-decoration: none; color: #6c8cff; }

  pre { white-space: pre-wrap; word-break: break-word; margin: 0;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
    max-height: 420px; overflow: auto; }
  .warn { padding: 12px 14px; border-radius: 10px; font-size: 13px;
    background: rgba(210,140,0,.13); border: 1px solid rgba(210,140,0,.5); }
  #status { margin-left: 10px; font-size: 13px; }
</style>

<h1 id="title">Saved post</h1>
<p class="sub" id="folderName">Loading…</p>
<p id="openRow" style="display:none;margin:-14px 0 22px;">
  <button id="openFolder" class="ghost" type="button">Open folder</button>
  <span id="openHint" class="hint" style="margin-left:10px;"></span>
</p>

<div id="needsPermission" class="warn" style="display:none;">
  Chrome forgets folder access when the browser restarts, so this page can't read
  the files yet.
  <div style="margin-top:10px;">
    <button id="allow" type="button">Allow access</button>
  </div>
</div>

<fieldset id="mediaBox" style="display:none;">
  <legend>Images and video</legend>
  <div class="grid" id="grid"></div>
  <div class="hint">
    Use <b>Save</b> on a tile to put a copy wherever you like. Dragging straight
    into another app may only carry a link rather than the file itself.
  </div>
</fieldset>

<fieldset id="promptBox" style="display:none;">
  <legend>prompt.txt</legend>
  <pre id="promptText"></pre>
  <div style="margin-top:12px;">
    <button id="copyPrompt" type="button">Copy prompt</button>
    <span id="status"></span>
  </div>
</fieldset>

<div id="empty" class="warn" style="display:none;"></div>

<script src="idb.js"></script>
<script src="saved.js"></script>
